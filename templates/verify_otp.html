<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Bodim-Link NCP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v=6) }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    
    <div class="auth-wrapper">
        <div class="auth-card" style="max-width: 450px;">
            <div class="auth-logo"><i class="fa-solid fa-shield-halved"></i></div>
            <h2 style="margin-bottom: 5px;">Verify OTP</h2>
            <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">Please enter the 6-digit code sent to your email.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div style="padding: 10px; margin-bottom: 15px; border-radius: 8px; font-size: 14px; 
                    {% if category == 'success' %}background: #dcfce7; color: #166534; border: 1px solid #bbf7d0;
                    {% else %}background: #fee2e2; color: #991b1b; border: 1px solid #fecaca;{% endif %}">
                    {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form class="auth-form" action="/verify_otp" method="POST">
                
                <label>6-Digit OTP</label>
                <div class="auth-input-group">
                    <i class="fa-solid fa-hashtag"></i>
                    <input type="text" name="otp" placeholder="XXXXXX" required maxlength="6" pattern="\d{6}">
                </div>

                <button type="submit" class="auth-btn">Verify <i class="fa-solid fa-check"></i></button>
            </form>

            <div style="margin-top: 25px; font-size: 12px; color: var(--text-light);">
                Didn't receive code? <a href="/forgot_password" style="color: var(--primary); text-decoration: none; font-weight: 600;">Try Again</a>
            </div>
        </div>
    </div>

</body>
</html>
