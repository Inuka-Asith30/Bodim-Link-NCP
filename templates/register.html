<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Bodim-Link NCP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v=6) }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    
    <nav class="navbar">
        <div class="nav-logo">
            <i class="fa-solid fa-house-chimney"></i>
            <div>
                Bodim - Link NCP
                <div style="font-size: 10px; font-weight: 400; color: #64748b;">Student Accommodation & Boarding</div>
            </div>
        </div>
        <ul class="nav-menu">
            <li><a href="/">Home</a></li>
            <li><a href="/student">For Students</a></li>
            <li><a href="/owner">For Owners</a></li>
            <li><a href="#">Boardings</a></li>
        </ul>
        <div class="nav-auth">
            <a href="/login" class="btn-outline"><i class="fa-regular fa-user"></i> Login</a>
            <a href="/register" class="btn-solid"><i class="fa-solid fa-user-plus"></i> Register</a>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card" style="max-width: 500px;">
            <div class="auth-logo"><i class="fa-solid fa-house-chimney"></i></div>
            <h2>Bodim - Link NCP</h2>
            <p style="font-size: 11px; margin-bottom: 25px;">Students Accommodation & Boarding</p>

            <h3 style="font-size: 18px; margin-bottom: 5px;">Create an Account</h3>
            <p>Join Bodim-Link NCP today</p>

            <form class="auth-form" action="/register" method="POST" enctype="multipart/form-data">
                
                <div style="display: flex; gap: 15px;">
                    <div style="flex: 1;">
                        <label>Full Name</label>
                        <div class="auth-input-group">
                            <i class="fa-regular fa-user"></i>
                            <input type="text" name="name" placeholder="John Doe" required>
                        </div>
                    </div>
                    <div style="flex: 1;">
                        <label>Phone Number</label>
                        <div class="auth-input-group">
                            <i class="fa-solid fa-phone"></i>
                            <input type="text" name="phone" placeholder="07XXXXXXXX" required>
                        </div>
                    </div>
                </div>

                <label>Email Address</label>
                <div class="auth-input-group">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" name="email" placeholder="Student@example.com" required>
                </div>

                <label>I am a...</label>
                <div class="auth-input-group">
                    <i class="fa-solid fa-users"></i>
                    <select id="role" name="role" required onchange="toggleOwnerFields()">
                        <option value="" disabled selected>Select your role</option>
                        <option value="student">Student (Looking for a place)</option>
                        <option value="owner">Owner (Renting out a place)</option>
                    </select>
                </div>

                <!-- Owner Specific Fields -->
                <div id="owner-fields" class="hidden">
                    <label>Upload Electricity Bill (Verification)</label>
                    <div class="auth-input-group" style="margin-bottom: 25px;">
                        <i class="fa-solid fa-file-invoice"></i>
                        <input type="file" id="electricity_bill" name="electricity_bill" accept="image/*,.pdf" style="padding-left: 45px; padding-top: 9px;">
                    </div>
                </div>

                <label>Password</label>
                <div class="auth-input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="auth-btn">Register <i class="fa-solid fa-arrow-right"></i></button>
            </form>

            <div style="margin-top: 25px; font-size: 12px; color: var(--text-light);">
                Already have an account? <a href="/login" style="color: var(--primary); text-decoration: none; font-weight: 600;">Login Here</a>
            </div>
        </div>
    </div>

    <!-- JavaScript to toggle owner fields -->
    <script>
        function toggleOwnerFields() {
            var role = document.getElementById("role").value;
            var ownerFields = document.getElementById("owner-fields");
            var billInput = document.getElementById("electricity_bill");
            
            if (role === "owner") {
                ownerFields.classList.remove("hidden");
                billInput.required = true;
            } else {
                ownerFields.classList.add("hidden");
                billInput.required = false;
            }
        }
    </script>
</body>
</html>
