<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Bodim-Link NCP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v=6) }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    
    <div class="auth-wrapper">
        <div class="auth-card" style="max-width: 450px;">
            <div class="auth-logo"><i class="fa-solid fa-unlock-keyhole"></i></div>
            <h2 style="margin-bottom: 5px;">Forgot Password?</h2>
            <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">Enter your registered email address to receive an OTP.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div style="padding: 10px; margin-bottom: 15px; border-radius: 8px; font-size: 14px; 
                    {% if category == 'success' %}background: #dcfce7; color: #166534; border: 1px solid #bbf7d0;
                    {% else %}background: #fee2e2; color: #991b1b; border: 1px solid #fecaca;{% endif %}">
                    {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form class="auth-form" action="/forgot_password" method="POST">
                
                <label>Email Address</label>
                <div class="auth-input-group">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" name="email" placeholder="student@example.com" required>
                </div>

                <button type="submit" class="auth-btn">Send OTP <i class="fa-solid fa-paper-plane"></i></button>
            </form>

            <div style="margin-top: 25px; font-size: 12px; color: var(--text-light);">
                Remember your password? <a href="/login" style="color: var(--primary); text-decoration: none; font-weight: 600;">Login Here</a>
            </div>
        </div>
    </div>

</body>
</html>
